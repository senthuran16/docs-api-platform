# Experimental version router for API Manager.
#
# Purpose: let infra configure ONE routing rule for the whole product
# (/api-manager -> this deployment's URL) instead of one rule per version.
# Every version's real backend is proxied here, invisibly - the reader's
# address bar never sees the raw choreoapps.dev address, and adding a new
# version later only means editing this one file and redeploying this one
# component, not touching infra's gateway again.
#
# This is purely additive: it does not modify or replace any existing
# per-version deployment. Each location below still points at that
# version's own, already-live Choreo URL.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Redirect all temp paths to /tmp (writable in read-only filesystems) -
    # proxying (unlike docs-shared's plain static serving) makes nginx
    # actually use proxy_temp_path to buffer upstream responses.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Each backend is itself a Choreo app almost certainly fronted by a
    # shared gateway that routes by SNI/Host - both must reflect the real
    # backend's own hostname, not this router's, or the backend's own
    # ingress may reject/misroute the request.
    proxy_ssl_server_name on;

    # A version requested without its trailing slash (e.g. /api-manager/4.7.0)
    # must land on the slash form before proxying, same as mkdocs' own
    # use_directory_urls behavior - otherwise relative asset/page links on
    # the proxied page would resolve one level too shallow.
    location ~ ^/api-manager/(\d+\.\d+\.\d+)$ {
        return 301 $scheme://$host/api-manager/$1/;
    }

    # The default version's manifest - root-index.json points every
    # product's manifestUrl at this exact bare path (no version segment).
    # Update this whenever the configured default version changes.
    location = /api-manager/product-nav-manifest.json {
        proxy_pass https://0f2f65aa-8eb1-45c9-85b5-3ce198bd532a.e1-us-east-azure.choreoapps.dev/api-manager/product-nav-manifest.json;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/4.7.0/ {
        proxy_pass https://0f2f65aa-8eb1-45c9-85b5-3ce198bd532a.e1-us-east-azure.choreoapps.dev/api-manager/4.7.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/4.6.0/ {
        proxy_pass https://af9e99fc-6a88-4960-a69e-5ffdcd457040.e1-us-east-azure.choreoapps.dev/api-manager/4.6.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/4.5.0/ {
        proxy_pass https://9601dab6-b5d5-4c76-844a-23adabf456ce.e1-us-east-azure.choreoapps.dev/api-manager/4.5.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/4.4.0/ {
        proxy_pass https://016ec2d5-7731-44af-aa60-0c153c692bb7.e1-us-east-azure.choreoapps.dev/api-manager/4.4.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/4.3.0/ {
        proxy_pass https://8703ad4a-5a8b-46d4-abe6-764a9b745629.e1-us-east-azure.choreoapps.dev/api-manager/4.3.0/;
        proxy_set_header Host $proxy_host;
    }

    # 4.0.0 / 4.1.0 / 4.2.0 intentionally omitted - those deployments are
    # still failing to build/deploy as of this writing. Add their location
    # blocks (same shape as the others) once they're live.

    location /api-manager/3.2.0/ {
        proxy_pass https://96bc6fb8-b05b-40a7-a0b2-65ccd80a64c3.e1-us-east-azure.choreoapps.dev/api-manager/3.2.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/3.1.0/ {
        proxy_pass https://4f2660ec-ab45-424e-afcb-35186e853555.e1-us-east-azure.choreoapps.dev/api-manager/3.1.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/3.0.0/ {
        proxy_pass https://8540e59c-40d5-4309-8473-4163804cfa88.e1-us-east-azure.choreoapps.dev/api-manager/3.0.0/;
        proxy_set_header Host $proxy_host;
    }
}
